version: 2
product: Scnehaux Codex
architecture_style: clean-architecture-inspired
principles:
- dependencies-point-inward
- deterministic-and-probabilistic-capabilities-are-separated
- fitness-functions-are-verification-not-product-runtime
- adapters-do-not-own-domain-semantics
- scm-provider-adapters-do-not-own-governance-semantics
- interfaces-do-not-own-domain-semantics
package:
  root: engine
  core:
    responsibility:
    - pure-domain-models
    - artifact-metamodel
    - repository-model
    - knowledge-graph-model
    - stable-contracts
    - evidence-provenance-contracts
    - context-package-contracts
    - retrieval-contracts
    - approval-decision-contracts
    - renderable-artifact-state
    forbidden_dependencies:
    - engine.control
    - engine.intelligence
    - engine.adapters
    - engine.interfaces
  control:
    execution: deterministic
    responsibility:
    - linting
    - parsing
    - validation
    - governance-policy
    - admission
    - auditing
    - deterministic-projections
    - graph-simulation
    - deterministic-rendering
    forbidden_dependencies:
    - engine.intelligence
  intelligence:
    execution: probabilistic
    responsibility:
    - typed-reasoning-contracts
    - intent-analysis
    - architecture-planning
    - research
    - context-reasoning
    - architecture-synthesis
    - ai-architecture-review
    authority: proposal-and-review-only
    forbidden_dependencies:
    - engine.control
  adapters:
    responsibility:
    - git
    - scm-provider
    - graph-store
    - semantic-index
    - model-provider
    - web
    - observed-sources
  interfaces:
    responsibility:
    - cli
    - api
    - mcp
dependency_direction:
- core-has-no-outward-dependency
- control-depends-on-core
- intelligence-depends-on-core-and-ports
- adapters-implement-outward-facing-ports
- interfaces-compose-use-cases
- control-and-intelligence-do-not-import-each-other-directly
repository_authority:
  canonical_repository_model:
    location: engine/core/repository
    role: immutable-collection-of-artifact-model
    status: active
  repository_assembler:
    location: engine/control/repository
    role: filesystem-discovery-parsing-and-model-construction
    status: active
  invariant:
  - core-must-not-import-control
  - filesystem-and-parsing-do-not-belong-to-core-repository-model
  - control-builds-core-repository-model-through-explicit-assembler-boundary
  - graph-and-generators-consume-canonical-artifact-model-semantics
test_layout:
  product_tests:
    root: tests
    mirrors: engine
  tooling_tests:
    roots:
    - tests/generators
    - tests/scripts
    mirrors:
    - generators
    - scripts
  invariant:
  - tests-follow-source-ownership
  - all-framework-regression-tests-live-under-tests
knowledge_foundation:
  provenance:
    location: engine/core/knowledge/provenance.py
    chain:
    - claim
    - evidence
    - source
    - authority
    - revision
    invariant:
    - material-claims-preserve-evidence
    - source-authority-is-explicit
    - knowledge-revision-is-explicit
  context:
    location: engine/core/knowledge/context.py
    contract: ContextPackage
    scopes:
    - global
    - organization
    - domain
    - project
    - working
    - observed
    invariant:
    - context-is-bounded
    - context-preserves-claim-provenance
    - context-does-not-create-authority
  retrieval:
    location: engine/core/knowledge/retrieval.py
    modes:
    - exact-id
    - graph
    - full-text
    - semantic
    - observed
    - research
    hybrid_supported: true
    semantic_authority: supplementary
    exact_id_preferred_when_known: true
    graph_preferred_for_relationship_questions: true
    contracts:
    - RetrievalRequest
    - RetrievalStrategy
    - ContextCompiler
intelligence_contracts:
  intent_and_planning:
    location: engine/intelligence/planning/contracts.py
    contracts:
    - IntentSpec
    - ArchitecturePlan
    supporting_types:
    - PlanStep
  research:
    location: engine/intelligence/research/contracts.py
    contracts:
    - ResearchPlan
    - ResearchPackage
    supporting_types:
    - ResearchQuestion
    - ResearchFinding
  synthesis:
    location: engine/intelligence/synthesis/contracts.py
    contracts:
    - ArchitectureProposal
    - ArtifactDraft
    supporting_types:
    - DraftPayload
  invariant:
  - contracts-do-not-select-agent-or-service-topology
  - intelligence-contracts-do-not-import-control
  - research-findings-preserve-evidence-backed-claims
  - research-findings-are-not-proposed-claims
  - architecture-proposals-contain-only-proposed-claims
  - artifact-drafts-are-structured-pre-render-state
  - artifact-drafts-preserve-proposal-claim-lineage
  - proposals-and-drafts-have-no-approval-authority
  - contracts-remain-provider-independent
phase6_9_contracts:
  validation:
    location: engine/control/validation/contracts.py
    contract: ValidationReport
    authority: deterministic-machine-verifiable-facts
  simulation:
    location: engine/control/simulation
    contract: SimulationReport
    implementation: graph-simulation
    state_model: current-plus-proposed-without-canonical-mutation
  review:
    location: engine/intelligence/review/contracts.py
    contract: ArchitectureReview
    authority: advisory-only
  approval:
    location: engine/core/governance/approval.py
    contract: ApprovalPackage
    supporting_types:
    - ApprovalDecision
    - ApprovalRequirement
    - DecisionOutcome
    default_authority: human-for-consequential-decisions
    auto_approval: adopter-policy-only
  rendering:
    artifact_state: engine/core/metamodel/document.py
    implementation: engine/control/rendering/artifact.py
    invariant: structured-state-render-parse-artifactmodel-semantic-equivalence
  invariant:
  - deterministic-validation-is-not-replaced-by-ai-review
  - graph-simulation-does-not-mutate-current-or-proposed-inputs
  - architecture-review-does-not-grant-approval
  - approval-contract-is-neutral-to-control-and-intelligence
  - control-and-intelligence-do-not-import-each-other
  - rendered-markdown-is-a-projection-not-authority-before-admission
  - round-trip-equivalence-is-semantic-not-byte-oriented
temporary_tooling:
  policy: migration-and-probe tooling is non-authoritative and must be absent before
    Genesis
  repository_root_python_allowlist:
  - conftest.py
  temporary_root_patterns:
  - phase*.py
  - slice5_*.py
  permanent_tool_roots:
  - engine/
  - generators/
  - scripts/
  - tests/
  genesis_requirement: temporary-root-tools-absent
  evidence_requirement: temporary tools must not be implementation or test evidence
genesis_integrity:
  authority: engine/control/governance/genesis.py
  invocation: scripts/genesis_integrity.py
  contract:
  - genesis-is-a-repository-event-not-document-approval
  - pre-genesis-audits-live-nonignored-candidate-tree
  - post-genesis-audits-the-immutable-root-commit-tree
  - architecture-artifacts-are-forbidden-from-genesis
  - governance-baseline-remains-draft-0.x-at-genesis
  - architecture-admission-remains-closed-at-genesis
  - legacy-source-provenance-is-pinned-by-full-commit-sha
  - only-bootstrap-manifest-allowed-paths-may-enter-genesis
  - root-history-must-have-exactly-one-root-commit-after-genesis
version_mutation_integrity:
  version_authority: engine/core/governance/versioning.py
  mutation_authority: engine/control/governance/mutation.py
  invocation: scripts/mutation_integrity.py
  contract:
  - semantic-version-format-is-canonical-major-minor-patch
  - governed-document-identity-is-immutable
  - post-baseline-governed-document-mutation-requires-strict-version-increase
  - governed-document-version-must-not-regress
  - raw-governed-document-deletion-is-forbidden
  - rename-or-move-is-a-versioned-mutation
  - pre-genesis-has-no-mutation-baseline-but-validates-version-and-identity
  - post-genesis-compares-working-tree-against-head
  - mutation-control-does-not-open-architecture-admission
  - git-remains-history-and-provenance-not-policy-inference
  - ci-compares-committed-head-against-pr-base-merge-base
  - clean-ci-checkout-cannot-bypass-version-bump-enforcement
  - committed-mutation-baseline-is-explicit-and-fail-closed
  committed_mutation_authority: engine/control/governance/committed_mutation.py
  ci_invocation: scripts/committed_mutation_integrity.py
governance_qualification:
  authority: engine/control/governance/readiness.py
  invocation: scripts/governance_qualify.py
  required_controls:
    temporary_tooling:
      policy_ref: temporary_tooling
      implementation:
      - governance/framework/source-layout.yaml
      test_evidence:
      - tests/scripts/test_temporary_tool_hygiene.py
    genesis_integrity:
      policy_ref: genesis_integrity
      implementation:
      - engine/control/governance/genesis.py
      - scripts/genesis_integrity.py
      test_evidence:
      - tests/control/governance/test_genesis.py
      - tests/scripts/test_genesis_integrity.py
    version_mutation_integrity:
      policy_ref: version_mutation_integrity
      implementation:
      - engine/core/governance/versioning.py
      - engine/control/governance/mutation.py
      - scripts/mutation_integrity.py
      - engine/control/governance/committed_mutation.py
      - scripts/committed_mutation_integrity.py
      test_evidence:
      - tests/core/governance/test_versioning.py
      - tests/control/governance/test_mutation.py
      - tests/scripts/test_mutation_integrity.py
      - tests/control/governance/test_committed_mutation.py
      - tests/scripts/test_committed_mutation_integrity.py
    genesis_commit_qualification:
      policy_ref: genesis_commit_qualification
      implementation:
      - engine/control/governance/genesis_candidate.py
      - scripts/genesis_commit_qualify.py
      test_evidence:
      - tests/control/governance/test_genesis_candidate.py
      - tests/scripts/test_genesis_commit_qualify.py
    scm_enforcement_trust_boundary:
      policy_ref: scm_enforcement_trust_boundary
      implementation:
      - governance/scm/trust-boundary.yaml
      - engine/control/governance/scm_trust.py
      - scripts/scm_trust_boundary_check.py
      test_evidence:
      - tests/control/governance/test_scm_trust.py
      - tests/scripts/test_scm_trust_boundary_check.py
    github_reference_enforcement:
      policy_ref: github_reference_enforcement
      implementation:
      - governance/github/main-ruleset.json
      - .github/workflows/governance.yml
      - .github/CODEOWNERS
      - .github/pull_request_template.md
      - scripts/github_policy_check.py
      test_evidence:
      - tests/scripts/test_github_policy_check.py
  contract:
  - local-qualification-is-fail-closed
  - qualification-does-not-approve-governance
  - qualification-does-not-open-architecture-admission
  - every-required-control-resolves-policy-implementation-and-test-evidence
  - temporary-tooling-cannot-satisfy-permanent-evidence
  - repository-root-python-remains-conftest-only
  - bootstrap-manifest-points-to-the-permanent-qualifier
  - full-qualification-runs-the-repository-per-file-coverage-gate
genesis_commit_qualification:
  authority: engine/control/governance/genesis_candidate.py
  invocation: scripts/genesis_commit_qualify.py
  contract:
  - qualification-is-valid-only-while-head-is-unborn
  - canonical-branch-must-match-bootstrap-manifest
  - every-genesis-candidate-file-must-be-staged
  - untracked-files-are-forbidden-at-commit-boundary
  - unstaged-worktree-mutations-are-forbidden-at-commit-boundary
  - staged-tree-must-satisfy-bootstrap-path-contract
  - required-governance-baseline-is-read-from-the-git-index
  - staged-governance-baseline-remains-draft-0.x
  - staged-tree-sha-is-materialized-before-root-commit
  - architecture-admission-remains-closed
scm_enforcement_trust_boundary:
  authority: engine/control/governance/scm_trust.py
  desired_state: governance/scm/trust-boundary.yaml
  invocation: scripts/scm_trust_boundary_check.py
  provider_neutral: true
  contract:
  - candidate-repository-state-is-not-sufficient-enforcement-authority
  - external-authority-is-required
  - external-authority-is-not-mutable-by-candidate
  - external-authority-is-independently-administered
  - repository-boundary-is-not-trust-boundary
  - provider-adapters-do-not-own-governance-semantics
  - design-time-trust-contract-does-not-prove-effective-enforcement
github_reference_enforcement:
  provider: github
  role: reference-provider-adapter
  desired_state: governance/github/main-ruleset.json
  workflow: .github/workflows/governance.yml
  invocation: scripts/github_policy_check.py
  required_status_context: Governance Qualification
  contract:
  - default-branch-mutations-require-pull-request
  - required-status-check-is-strict-against-latest-base
  - required-status-check-validates-committed-mutation-delta
  - force-push-is-forbidden
  - default-branch-deletion-is-forbidden
  - linear-history-is-required
  - squash-is-the-only-allowed-merge-method
  - ruleset-bypass-actors-are-empty
  - first-party-actions-are-pinned-by-full-commit-sha
  - mandatory-human-approval-is-zero-until-a-second-independent-reviewer-exists
tooling:
  roots:
    generators: generators
    scripts: scripts
    tests: tests
  responsibility:
  - deterministic-gates
  - fixtures
  - fitness-tooling
  - verification-tooling
  product_runtime_allowed: false
  invariant:
  - framework-tooling-is-not-an-architecture-artifact-root
  - consumer-artifacts-resolve-from-the-invocation-repository
repository_boundary:
  codex_framework_owns:
  - governance
  - schemas
  - templates
  - engine
  - generators
  - scripts
  - tests
  architecture_repository_owns:
  - enterprise
  - standards
  - domains
  - systems
  - designs
  - decisions
  invariant:
  - codex-does-not-own-canonical-architecture-instances
  - architecture-repositories-consume-a-pinned-codex-version
  - directory-ordering-is-not-semantic-authority
