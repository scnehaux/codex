contract_version: 1
kind: scnehaux-extension-declarations
owns:
- extension-declarations
- compatibility-metadata
data:
  extension_points:
  - artifact-type
  - schema
  - renderer
  - validator
  - relationship-type
  - context-provider
  - retriever
  - observed-source
  - graph-store
  - semantic-index
  - model-provider
  - scm-provider
  company_pack_must_not_require_core_fork: true
  profile_id: scnehaux-codex-default
  profile_version: 2
  profile_core_fork_required: false
  extension_policy:
    additive:
    - artifact-type
    - relationship-type
    governed-restriction: []
    compatibility-preserving-override: []
    forbidden-core-semantic-override:
    - artifact-type
    - relationship-type
  company_packs: []
  compatibility:
    backward_compatibility: same-major
    migration_mode: explicit-only
    history_origin:
      framework: 0.1.0
      ontology: 1.0.0
    migration_rules:
    - from:
        framework: 0.1.0
        ontology: 1.0.0
      to:
        framework: 0.2.0
        ontology: 1.0.0
      classification: backward-compatible
      action: no-transform
    deprecation:
      mode: explicit
      minimum_notice_minor_releases: 1
      removal_requires_major_bump: true
      declarations: []
