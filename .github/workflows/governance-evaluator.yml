name: Governance Evaluator Skeleton

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evaluator-skeleton:
    name: Governance Evaluator Skeleton
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Compile plan-only evaluator
        run: python -I -m compileall -q integrations/github-governance-evaluator
      - name: Run evaluator offline regression tests
        run: python -I -m unittest discover -s integrations/github-governance-evaluator/tests
      - name: Assert skeleton has no network or credential client imports
        shell: bash
        run: |
          if grep -R -nE '^\s*(from|import)\s+(urllib|requests|httpx|jwt|cryptography|socket|subprocess)(\.|\s|$)' integrations/github-governance-evaluator/evaluator.py; then
            echo 'Evaluator skeleton must remain plan-only and credential-free.' >&2
            exit 1
          fi
