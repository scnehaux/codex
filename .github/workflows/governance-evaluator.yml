name: Governance Evaluator Runtime Source Promotion

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evaluator-runtime-source-promotion:
    name: Governance Evaluator Runtime Source Promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Compile evaluator and read-only runtime
        run: python -I -m compileall -q integrations/github-governance-evaluator
      - name: Run decision, promotion, runtime, and evidence regression tests
        run: python -I -m unittest discover -s integrations/github-governance-evaluator/tests
      - name: Assert promoted evaluator remains offline and credential-free
        shell: bash
        run: |
          if grep -R -nE '^\s*(from|import)\s+(urllib|requests|httpx|jwt|cryptography|socket|subprocess)(\.|\s|$)' integrations/github-governance-evaluator/evaluator.py; then
            echo 'Promoted evaluator source must remain offline and credential-free.' >&2
            exit 1
          fi
      - name: Assert promoted runtime remains read-only and credential-free
        shell: bash
        run: |
          if grep -R -nE '^\s*(from|import)\s+(requests|httpx|jwt|cryptography|socket|subprocess)(\.|\s|$)' integrations/github-governance-evaluator/runtime.py; then
            echo 'Promoted runtime may use fixed stdlib urllib reads only; credential/process clients are forbidden.' >&2
            exit 1
          fi
          if grep -nE 'Bearer[[:space:]]|client[_-]?secret|private[_-]?key' integrations/github-governance-evaluator/runtime.py; then
            echo 'Promoted runtime must not contain credential-bearing request paths.' >&2
            exit 1
          fi
      - name: Verify pinned evaluator commit and exact blob
        shell: bash
        run: |
          revision=$(python -I -c "import json; print(json.load(open('integrations/github-governance-evaluator/promotion.json', encoding='utf-8'))['authority_source_revision'])")
          test "$revision" = "23b05a855419b86b61b0c9266805bb66b143c366"
          git cat-file -e "${revision}^{commit}"
          git merge-base --is-ancestor "$revision" HEAD
          expected_blob=$(git rev-parse "${revision}:integrations/github-governance-evaluator/evaluator.py")
          current_blob=$(git hash-object integrations/github-governance-evaluator/evaluator.py)
          test "$expected_blob" = "ab2f152c21bd6d6f22df21172c4d027035ff8c11"
          test "$current_blob" = "$expected_blob"
      - name: Verify pinned runtime commit and exact blob
        shell: bash
        run: |
          revision=$(python -I -c "import json; print(json.load(open('integrations/github-governance-evaluator/runtime-promotion.json', encoding='utf-8'))['runtime_source_revision'])")
          path=$(python -I -c "import json; print(json.load(open('integrations/github-governance-evaluator/runtime-promotion.json', encoding='utf-8'))['runtime_source_path'])")
          blob=$(python -I -c "import json; print(json.load(open('integrations/github-governance-evaluator/runtime-promotion.json', encoding='utf-8'))['runtime_source_blob'])")
          test "$revision" = "cbd64f78c8f72f28880d4673729a796b249d8eae"
          test "$path" = "integrations/github-governance-evaluator/runtime.py"
          test "$blob" = "c59911e9c0800c917fed21e6f33f3181c3a61e60"
          git cat-file -e "${revision}^{commit}"
          git merge-base --is-ancestor "$revision" HEAD
          expected_blob=$(git rev-parse "${revision}:${path}")
          current_blob=$(git hash-object "$path")
          test "$expected_blob" = "$blob"
          test "$current_blob" = "$blob"
      - name: Assert live provenance stays conservative and activation is evidence-bound
        shell: bash
        run: |
          python -I - <<'PY'
          import json
          from pathlib import Path

          runtime_contract = json.loads(
              Path('integrations/github-governance-evaluator/runtime-promotion.json').read_text(
                  encoding='utf-8'
              )
          )
          if runtime_contract['promotion'] != {
              'mode': 'privileged-explicit',
              'state': 'runtime-source-pinned',
              'candidate_may_select_effective_revision': False,
              'auto_deploy_from_candidate': False,
          }:
              raise SystemExit('Runtime source-promotion semantics drifted')
          if runtime_contract['runtime'] != {
              'execution_location': 'external',
              'exported_copy_required': True,
              'live_instance_proven': False,
              'facts_provenance_verified': False,
              'publish_enabled': False,
              'authority_binding_advanced': False,
              'effective_enforcement_proven': False,
          }:
              raise SystemExit('Runtime promotion advanced beyond source pinning')

          evaluator_contract = json.loads(
              Path('integrations/github-governance-evaluator/promotion.json').read_text(
                  encoding='utf-8'
              )
          )
          if runtime_contract['evaluator_source_revision'] != evaluator_contract['authority_source_revision']:
              raise SystemExit('Runtime promotion is not bound to the promoted evaluator revision')

          evidence = json.loads(
              Path('governance/github/evidence/live-provenance-001.json').read_text(
                  encoding='utf-8'
              )
          )
          if evidence['source'] != {
              'runtime_source_revision': runtime_contract['runtime_source_revision'],
              'runtime_source_path': runtime_contract['runtime_source_path'],
              'runtime_source_blob': runtime_contract['runtime_source_blob'],
              'evaluator_source_revision': runtime_contract['evaluator_source_revision'],
              'evaluator_source_blob': runtime_contract['evaluator_source_blob'],
          }:
              raise SystemExit('Live evidence is not bound to the promoted source identities')
          if evidence['attestation'] != {
              'live_instance_proven': True,
              'facts_provenance_evidenced': True,
              'publisher_proven': False,
              'authority_binding_advanced': False,
              'effective_enforcement_proven': False,
          }:
              raise SystemExit('Live provenance evidence must remain a conservative historical record')
          if evidence['source_runtime_self_report'] != {
              'runtime_source_promoted': False,
              'facts_provenance_verified': False,
              'publish_enabled': False,
              'authority_binding_advanced': False,
              'effective_enforcement_proven': False,
          }:
              raise SystemExit('Governed evidence must retain the pinned runtime self-report verbatim')

          publisher = json.loads(
              Path('governance/github/evidence/publisher-live-001.json').read_text(
                  encoding='utf-8'
              )
          )
          if not (
              publisher.get('contract_version') == 1
              and publisher.get('kind') == 'scm-external-authority-publisher-evidence'
              and publisher.get('provider') == 'github'
              and publisher.get('repository') == 'scnehaux/codex'
              and publisher.get('authority', {}).get('integration_id') == 4864946
              and publisher.get('authority', {}).get('check_context') == 'Codex Governance Authority'
              and publisher.get('publisher', {}).get('check_run_id') == 103547296485
              and publisher.get('publisher', {}).get('candidate_sha') == 'a6ed1def64503ca57c647ce45937f887873aac6f'
              and publisher.get('publisher', {}).get('conclusion') == 'success'
              and publisher.get('publisher', {}).get('source_verified') is True
              and publisher.get('publisher', {}).get('exact_candidate_binding') is True
              and publisher.get('publisher', {}).get('credentials_isolated') is True
              and publisher.get('publisher', {}).get('candidate_code_executed') is False
              and publisher.get('claims', {}).get('effective_enforcement_proven') is False
          ):
              raise SystemExit('Publisher evidence is not bound to the proven GitHub App check')

          binding = Path('governance/github/authority-binding.yaml').read_text(encoding='utf-8')
          required = [
              'authority_revision: 23b05a855419b86b61b0c9266805bb66b143c366',
              'candidate_revision_as_authority: false',
              'auto_deploy_from_candidate: false',
              'promotion: privileged-explicit',
              'state: planned',
              'live_provenance_evidence: governance/github/evidence/live-provenance-001.json',
              'publisher_evidence: governance/github/evidence/publisher-live-001.json',
              'effective_enforcement_claimed: false',
          ]
          missing = [item for item in required if item not in binding]
          if missing:
              raise SystemExit(
                  'Evidence-bound authority activation drifted: ' + ', '.join(missing)
              )
          PY
