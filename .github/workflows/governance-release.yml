name: Governance Release Candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact Codex head with published Authority check and identical merged main tree
        required: true
      authority_commit:
        description: Exact Authority commit containing the canonical release manifest
        required: true
      release_version:
        description: Stable Governance release version (MAJOR.MINOR.PATCH)
        required: true
      manifest_sha256:
        description: Published SHA-256 of the canonical manifest bytes
        required: true

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate immutable candidate declaration
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          python - <<'PY'
          import os, re
          for name, pattern in {
              "SOURCE_COMMIT": r"[0-9a-f]{40}",
              "AUTHORITY_COMMIT": r"[0-9a-f]{40}",
              "RELEASE_VERSION": r"[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",
              "MANIFEST_SHA256": r"[0-9a-f]{64}",
          }.items():
              if re.fullmatch(pattern, os.environ[name]) is None:
                  raise SystemExit("Invalid candidate field: " + name)
          PY
      - name: Checkout exact Codex release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          path: codex
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout independently committed Authority manifest
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: scnehaux/codex-authority
          ref: ${{ inputs.authority_commit }}
          path: authority
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.15"
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install locked qualification toolchain
        working-directory: codex
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e ".[dev]"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Recompute manifest and verify independent provider evidence
        working-directory: codex
        env:
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/governance_release.py verify --authority-root ../authority --release-version "$RELEASE_VERSION" --manifest-revision "$AUTHORITY_COMMIT" --manifest-sha256 "$MANIFEST_SHA256"
      - name: Qualify the exact release source
        working-directory: codex
        run: make governance-qualify
